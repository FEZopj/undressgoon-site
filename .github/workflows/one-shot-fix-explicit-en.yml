name: One-shot fix explicit English navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-explicit-en.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make index.html an explicit English destination
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  (function(){try{
    var LANGS={es:'/es/',pt:'/pt/',zh:'/zh/',ja:'/ja/',ru:'/ru/',fr:'/fr/',de:'/de/'};
    if(localStorage.getItem('ug_lang'))return;
    if(sessionStorage.getItem('ug_lang_redirected'))return;
    if(/^\\/(es|pt|zh|ja|ru|fr|de)\\//i.test(location.pathname))return;
    var nav=(navigator.language||navigator.userLanguage||'').slice(0,2).toLowerCase();
    var dest=LANGS[nav];
    if(!dest)return;
    sessionStorage.setItem('ug_lang_redirected','1');
    location.replace(dest+location.search+location.hash);
  }catch(e){}})();'''
          new = '''  (function(){try{
    var LANGS={es:'/es/',pt:'/pt/',zh:'/zh/',ja:'/ja/',ru:'/ru/',fr:'/fr/',de:'/de/'};
    var path=(location.pathname||'/').replace(/\\/{2,}/g,'/');
    // /index.html is an explicit/manual English destination. Never auto-route
    // it back to the browser language; this also works when storage is blocked.
    if(/\\/index\\.html$/i.test(path)){
      try{localStorage.setItem('ug_lang','en');}catch(e){}
      return;
    }
    // Language auto-detection is only for the canonical bare root.
    if(path!='/')return;
    if(localStorage.getItem('ug_lang'))return;
    if(sessionStorage.getItem('ug_lang_redirected'))return;
    var nav=(navigator.language||navigator.userLanguage||'').slice(0,2).toLowerCase();
    var dest=LANGS[nav];
    if(!dest)return;
    sessionStorage.setItem('ug_lang_redirected','1');
    location.replace(dest+location.search+location.hash);
  }catch(e){}})();'''
          if old not in s:
              raise SystemExit('Expected language auto-route block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-explicit-en.yml
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Treat index.html as explicit English navigation"
          git push origin HEAD:main
